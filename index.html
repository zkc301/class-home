<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>班级主页</title>
<meta name="description" content="清新护眼班级主页 - 阳光班">
<style>
:root{--p:#7ec8e3;--pd:#4ea3cc;--ps:#d6ecf7;--t:#2c3e50;--tl:#5d7280;--b:#d6eaf8;--sh:0 6px 20px rgba(126,200,227,.18);--r:clamp(12px,2vw,18px);--rs:clamp(8px,1.5vw,12px);--d:#d96666}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}html{scroll-behavior:smooth;font-size:clamp(12px,1.6vw,14px)}
body{-webkit-text-size-adjust:100%;-moz-text-size-adjust:100%;text-size-adjust:100%;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(180deg,#eaf4fc,#f5fafd);color:var(--t);line-height:1.7;overflow-x:hidden;min-height:100vh;padding-bottom:env(safe-area-inset-bottom);overscroll-behavior:contain}
.wrap{max-width:min(980px,95vw);margin:0 auto;padding:0 clamp(10px,1.5vw,16px) clamp(30px,4vw,60px)}
#ab{position:fixed;top:clamp(8px,1.5vw,12px);right:clamp(8px,1.5vw,12px);z-index:100;background:#fff;padding:clamp(4px,1vw,8px) clamp(6px,1.2vw,12px);border-radius:clamp(10px,1.5vw,14px);box-shadow:var(--sh);display:none;flex-direction:column;gap:clamp(3px,0.8vw,6px);min-width:clamp(110px,14vw,140px);font-size:clamp(11px,1.3vw,13px)}
header{background:linear-gradient(135deg,#7ec8e3,#a8d8ea);color:#fff;border-radius:0 0 var(--r) var(--r);box-shadow:var(--sh);position:sticky;top:0;z-index:50}
.hi{max-width:min(980px,95vw);margin:0 auto;padding:clamp(6px,1.2vw,12px) clamp(10px,1.5vw,14px) clamp(4px,0.8vw,10px);display:flex;align-items:center;justify-content:space-between;gap:clamp(6px,1vw,12px);flex-wrap:wrap}
.br{display:flex;align-items:center;gap:clamp(6px,1.2vw,12px)}
.lg{width:clamp(26px,4vw,40px);height:clamp(26px,4vw,40px);border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:clamp(14px,2vw,22px);flex-shrink:0}
.br h1{font-size:clamp(13px,2vw,18px);font-weight:700;line-height:1.2}
.br .su{font-size:clamp(9px,1.1vw,11px);opacity:.9}
nav{background:rgba(255,255,255,.18);border-radius:var(--rs);display:flex;flex-wrap:wrap;gap:clamp(3px,0.6vw,8px);padding:clamp(4px,1vw,8px);justify-content:center}
nav button{flex:1 0 calc(50% - 4px);max-width:calc(50% - 4px);border:none;background:transparent;color:#fff;padding:clamp(5px,1vw,9px) clamp(4px,0.8vw,10px);border-radius:clamp(6px,0.8vw,8px);cursor:pointer;font-size:clamp(11px,1.4vw,13px);font-weight:500;transition:background .2s;touch-action:manipulation}
nav button:hover{background:rgba(255,255,255,.25)}nav button.active{background:#fff;color:var(--pd);font-weight:600}
main{padding-top:clamp(8px,1.5vw,16px)}
.page{display:none}.page.active{display:block;animation:f .35s ease}@keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.card{background:#fff;border-radius:var(--r);padding:clamp(10px,2vw,20px);box-shadow:var(--sh);margin-bottom:clamp(8px,1.5vw,16px);border:1px solid var(--b)}
.card h2{font-size:clamp(13px,1.6vw,17px);color:var(--pd);display:flex;align-items:center;gap:clamp(4px,1vw,8px);margin-bottom:clamp(6px,1vw,12px);padding-bottom:clamp(4px,0.8vw,10px);border-bottom:2px dashed var(--ps)}
.mt{color:var(--tl);font-size:clamp(11px,1.4vw,13px)}
.qb{background:linear-gradient(135deg,#d6ecf7,#fff);border-radius:var(--r);padding:clamp(12px,2vw,22px) clamp(10px,1.5vw,18px);text-align:center;border:1px solid var(--b);box-shadow:var(--sh);margin-bottom:clamp(8px,1.5vw,16px);position:relative}
.qb::before{content:"❝";position:absolute;left:clamp(8px,1.5vw,16px);top:0;font-size:clamp(40px,6vw,72px);color:var(--ps);font-family:Georgia;line-height:1}
.qt{font-size:clamp(13px,1.6vw,17px);font-weight:500;margin:clamp(2px,0.5vw,6px) 0 clamp(1px,0.3vw,4px)}
.qd{font-size:clamp(11px,1.3vw,13px);color:var(--tl)}
[contenteditable="true"]{outline:none;border-radius:8px;padding:4px 6px;cursor:text}[contenteditable="true"]:hover{background:#f4faff}[contenteditable="true"]:focus{background:#eef9fd;box-shadow:0 0 0 2px var(--p) inset}
.tb{display:flex;gap:clamp(4px,1vw,10px);flex-wrap:wrap;justify-content:flex-end;margin-bottom:clamp(8px,1.5vw,16px);align-items:center}.tb .mt{margin-right:auto}
.btn{border:none;cursor:pointer;border-radius:clamp(5px,0.8vw,8px);padding:clamp(4px,0.8vw,8px) clamp(8px,1.5vw,14px);font-size:clamp(10px,1.2vw,12px);font-weight:500;white-space:nowrap;touch-action:manipulation}
.bp{background:var(--p);color:#fff}.bp:hover{background:var(--pd)}.bg{background:var(--ps);color:var(--pd)}.bd{background:#fde2e2;color:var(--d)}
.tag{display:inline-block;background:var(--p);color:#fff;font-size:clamp(10px,1.2vw,12px);padding:clamp(0px,0.2vw,2px) clamp(5px,1vw,10px);border-radius:16px}
.dx{margin-left:auto;cursor:pointer;color:var(--d);border:none;background:transparent;font-size:clamp(14px,1.8vw,18px);padding:4px}
.hw{display:grid;grid-template-columns:auto 1fr;gap:clamp(4px,0.8vw,8px) clamp(6px,1.2vw,12px);background:var(--ps);border-radius:var(--rs);padding:clamp(6px,1vw,10px) clamp(8px,1.5vw,12px);margin-bottom:clamp(4px,0.8vw,10px);align-items:center}
.bg-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(220px,100%),1fr));gap:clamp(8px,1.5vw,16px)}
.bk{background:linear-gradient(160deg,#fff,var(--ps));border-radius:var(--rs);padding:clamp(8px,1.2vw,14px);border:1px solid var(--b);position:relative}
.bk .bt{font-weight:700;color:var(--pd);margin-bottom:clamp(2px,0.5vw,6px);font-size:clamp(13px,1.6vw,16px)}
.bk .ba{font-size:clamp(11px,1.3vw,14px);color:var(--tl);margin-bottom:clamp(4px,0.8vw,10px)}
.hr{display:flex;align-items:center;gap:clamp(4px,0.8vw,10px);padding:clamp(6px,1vw,10px) clamp(8px,1.5vw,14px);background:var(--ps);border-radius:var(--rs);margin-bottom:clamp(4px,0.8vw,10px)}
.medal{font-size:clamp(18px,2.5vw,26px)}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:clamp(11px,1.3vw,14px);table-layout:auto}table th{min-width:clamp(36px,7vw,60px);white-space:nowrap}table td{min-width:clamp(32px,6vw,55px)}
table th,table td{padding:clamp(4px,0.7vw,8px) clamp(3px,0.6vw,6px);text-align:center}
table th{background:var(--p);color:#fff}table th:first-child{border-radius:10px 0 0 0}table th:last-child{border-radius:0 10px 0 0}
table td{background:var(--ps);border:1px solid #fff}table tr:last-child td:first-child{border-radius:0 0 0 10px}table tr:last-child td:last-child{border-radius:0 0 10px 0}
.dc{font-weight:600;color:var(--pd);background:#eaf4fc!important}
.sw{overflow-x:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x;margin:0 -clamp(12px,2vw,16px);padding:0 clamp(12px,2vw,16px)}table.sc th,table.sc td{min-width:clamp(50px,8vw,70px);font-size:clamp(11px,1.3vw,13px)}
.mf{display:flex;flex-direction:column;gap:clamp(6px,1vw,12px);margin-bottom:clamp(12px,2vw,20px)}
.mf input,.mf textarea{width:100%;padding:clamp(8px,1.2vw,12px);border:1px solid var(--b);border-radius:var(--rs);font-size:clamp(13px,1.5vw,15px);font-family:inherit;background:#f8fcff}
.mf input:focus,.mf textarea:focus{outline:none;border-color:var(--p);background:#fff}.mf textarea{min-height:clamp(60px,10vw,80px);resize:vertical}
.ml{display:flex;flex-direction:column;gap:clamp(8px,1.5vw,14px)}
.mg{background:var(--ps);border-radius:var(--rs);padding:clamp(10px,1.8vw,16px) clamp(12px,2vw,18px);position:relative}
.mg .mh{display:flex;align-items:center;gap:clamp(4px,0.8vw,10px);margin-bottom:clamp(4px,0.8vw,8px)}
.mg .mn{font-weight:600;color:var(--pd);font-size:clamp(13px,1.5vw,16px)}
.mg .mt2{font-size:clamp(10px,1.2vw,13px);color:var(--tl);margin-left:auto}
.ig{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(160px,100%),1fr));gap:clamp(8px,1.5vw,14px)}
.ii{background:var(--ps);border-radius:var(--rs);padding:clamp(8px,1.2vw,12px);text-align:center}
.ii .lb{font-size:clamp(11px,1.3vw,13px);color:var(--tl)}
.ii .va{font-size:clamp(12px,1.5vw,15px);font-weight:600;color:var(--pd);margin-top:clamp(1px,0.3vw,3px)}
.ar{display:flex;gap:clamp(4px,0.8vw,10px);flex-wrap:wrap;margin-top:clamp(8px,1.5vw,14px)}
.ar input,.ar select{flex:1;min-width:clamp(100px,15vw,130px);padding:clamp(6px,1vw,10px);border:1px solid var(--b);border-radius:10px;font-size:clamp(12px,1.4vw,14px);background:#f8fcff}
.ar input:focus,.ar select:focus{outline:none;border-color:var(--p)}
.lock{display:none!important}body.admin .lock{display:flex!important;flex-direction:column;gap:8px}body.admin .lock-b{display:block}
.mm{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:center;justify-content:center;padding:clamp(12px,2vw,20px);backdrop-filter:blur(4px)}
.mm.hidden{display:none}
.md{background:#fff;border-radius:var(--r);padding:clamp(16px,2.5vw,28px);width:100%;max-width:min(380px,92vw);max-height:90vh;overflow-y:auto;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.md h3{color:var(--pd);margin-bottom:clamp(8px,1.2vw,14px);font-size:clamp(16px,2vw,20px)}
.md .row{margin-bottom:clamp(8px,1.2vw,14px)}.md label{display:block;font-size:clamp(12px,1.4vw,14px);margin-bottom:clamp(4px,0.6vw,8px);color:var(--tl)}
.md input{width:100%;padding:clamp(8px,1.2vw,12px);border:1px solid var(--b);border-radius:10px;font-size:clamp(13px,1.5vw,15px)}.md input:focus{outline:none;border-color:var(--p)}
.md .ac{display:flex;gap:clamp(4px,0.8vw,10px);justify-content:flex-end;margin-top:clamp(12px,1.8vw,20px)}.err{color:var(--d);font-size:clamp(11px,1.3vw,14px);min-height:18px;margin-top:4px}
footer{text-align:center;color:var(--tl);font-size:clamp(9px,1.1vw,11px);padding:clamp(10px,1.5vw,18px) clamp(10px,1.5vw,14px) clamp(6px,1vw,10px)}

/* === 超小屏手机 (iPhone SE, 旧安卓) === */
@media(max-width:380px){
  header{position:relative}
  nav button{flex:1 0 calc(50% - 3px);max-width:calc(50% - 3px);font-size:10px;padding:4px 2px}
  .wrap{padding:0 10px 40px}
  .hi{padding:10px 10px 8px}
  .ig{grid-template-columns:repeat(2,1fr);gap:8px}
  .bg-g{grid-template-columns:1fr}
  .hw{grid-template-columns:1fr;gap:4px}
  .card{padding:12px;margin-bottom:12px;border-radius:14px}
  .card h2{font-size:15px}
  nav button{padding:6px 9px;font-size:12px}
  .qt{font-size:15px}.qb{padding:16px 12px}
  .ii{padding:10px}.ii .va{font-size:14px}
  .sw{margin:0 -10px;padding:0 10px}
}

/* === 普通手机 === */
@media(max-width:480px) and (min-width:381px){
  .ig{grid-template-columns:repeat(2,1fr)}
  .bg-g{grid-template-columns:1fr}
  .hw{grid-template-columns:1fr}
}

/* === 手机竖屏 === */
@media(max-width:640px){
  header{position:relative}
  .hi{flex-direction:column;align-items:stretch;gap:8px}
  .br{justify-content:flex-start}
  nav{padding:5px 4px;gap:3px}
  nav button{padding:7px 10px;font-size:13px}
  main{padding-top:14px}
  .tb{margin-bottom:10px}
  .btn{padding:7px 12px}
  table th,table td{padding:7px 4px;font-size:12px}
}

/* === 手机横屏 / 矮屏 === */
@media(orientation:landscape) and (max-height:500px){
  header{position:relative}
  .hi{flex-direction:row;flex-wrap:wrap;padding:8px 14px;gap:10px}
  .br h1{font-size:16px}.br .su{display:none}
  .lg{width:34px;height:34px;font-size:18px}
  nav{flex-wrap:nowrap;overflow-x:auto}
  nav button{flex:0 0 auto;padding:6px 9px;font-size:12px}
  main{padding-top:10px}
  .card{padding:12px 14px;margin-bottom:10px}
  .ig{grid-template-columns:repeat(4,1fr);gap:8px}
  .bg-g{grid-template-columns:repeat(3,1fr);gap:8px}
  .qb{padding:14px}.qt{font-size:15px}
}

/* === 平板 === */
@media(min-width:641px){
  nav{flex-wrap:nowrap;overflow-x:auto}
  nav button{flex:0 0 auto}
}
@media(min-width:641px) and (max-width:980px){
  .wrap{max-width:min(96vw,900px)}
  .ig{grid-template-columns:repeat(3,1fr)}
  .bg-g{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
  .hw{grid-template-columns:auto 1fr}
}

/* === 大屏桌面 === */
@media(min-width:981px) and (max-width:1440px){
  .wrap{max-width:min(1100px,92vw)}
  .ig{grid-template-columns:repeat(4,1fr)}
  .bg-g{grid-template-columns:repeat(4,1fr)}
}

/* === 超大屏 === */
@media(min-width:1441px){
  .wrap{max-width:min(1200px,90vw)}
  .ig{grid-template-columns:repeat(5,1fr)}
  .bg-g{grid-template-columns:repeat(5,1fr)}
  html{font-size:17px}
}

/* === 微信浏览器修复 === */
@media(max-width:750px){
  header{position:relative}
  #ab{position:fixed}
  .sw{overflow-x:auto;-webkit-overflow-scrolling:touch}
}

/* === 触屏设备优化 === */
@media(hover:none) and (pointer:coarse){
  nav button{padding:10px 14px;font-size:14px}
  .btn{padding:10px 16px;font-size:14px}
  .dx{padding:8px;font-size:20px}
  [contenteditable="true"]{min-height:1.4em}
}
</style></head><body>
<div id="ab"><span id="as">🔓 维护者</span> <button class="btn bp" onclick="saveAll()">🔄 同步全班</button> <button class="btn bd" onclick="doLogout()">退出</button></div>
<header><div class="hi"><div class="br"><div class="lg">📚</div><div><h1 data-k="title">阳光班班级主页</h1><div class="su">温馨 · 进取 · 快乐成长</div></div></div>
<nav id="nav"><button data-p="home" class="active">首页</button><button data-p="homework">今日作业</button><button data-p="log">班级日志</button><button data-p="books">好书推荐</button><button data-p="honor">光荣榜</button><button data-p="duty">值日表</button><button data-p="message">留言箱</button><button data-p="schedule">课程表</button></nav></div></header>
<div class="wrap"><main>
<section class="page active" id="p-home"><div class="qb"><div class="qd" id="td"></div><div class="qt" id="dq">加载中…</div><div class="mt">—— 今日寄语 ——</div></div>
<div class="card"><h2>🏫 班级概览</h2><div class="tb"><span class="mt">💡 维护者登录后可改内容，改完点右上「同步全班」</span></div>
<div class="ig"><div class="ii"><div class="lb">班级</div><div class="va" data-k="info-class">三年二班</div></div><div class="ii"><div class="lb">班主任</div><div class="va" data-k="info-teacher">王老师</div></div><div class="ii"><div class="lb">人数</div><div class="va" data-k="info-count">42人</div></div><div class="ii"><div class="lb">口号</div><div class="va" data-k="info-slogan">向阳而生</div></div></div></div>
<div class="card"><h2>📋 公告栏</h2><div data-k="notice" style="min-height:60px"></div></div>
<button class="btn bp" onclick="openLogin()" style="display:block;margin:12px auto">🔑 密钥</button></section>
<section class="page" id="p-homework"><div class="card"><h2>📝 今日作业</h2><div class="tb"><button class="btn bp lock" onclick="saveAll()">💾 立即同步</button></div><div id="hl"></div><div class="ar lock"><select id="hs"><option>语文</option><option>数学</option><option>英语</option><option>科学</option><option>道法</option><option>美术</option><option>音乐</option><option>体育</option></select><input id="hc" placeholder="作业内容…"><button class="btn bp" onclick="addHw()">＋</button></div></div></section>
<section class="page" id="p-log"><div class="card"><h2>📔 班级日志</h2><div class="tb"><button class="btn bp lock" onclick="saveAll()">💾 立即同步</button></div><div data-k="log" style="min-height:240px;white-space:pre-wrap"></div></div></section>
<section class="page" id="p-books"><div class="card"><h2>📖 好书推荐</h2><div class="tb"><button class="btn bp lock" onclick="saveAll()">💾 立即同步</button></div><div id="bl" class="bg-g"></div><div class="ar lock"><input id="bt" placeholder="书名"><input id="ba" placeholder="作者"><button class="btn bp" onclick="addBook()">＋</button></div><input id="bd" class="lock" placeholder="推荐理由…" style="margin-top:8px;width:100%;padding:8px;border:1px solid var(--b);border-radius:10px;font-size:13px;background:#f8fcff"></div></section>
<section class="page" id="p-honor"><div class="card"><h2>🏆 光荣榜</h2><div class="tb"><button class="btn bp lock" onclick="saveAll()">💾 立即同步</button></div><div id="hl2"></div><div class="ar lock"><input id="hn" placeholder="姓名"><input id="hr" placeholder="表彰理由…"><button class="btn bp" onclick="addHonor()">＋</button></div></div></section>
<section class="page" id="p-duty"><div class="card"><h2>🧹 值日表</h2><div class="tb"><button class="btn bp lock" onclick="saveAll()">💾 立即同步</button></div><div class="sw"><table><thead><tr><th>项目</th><th>负责人</th><th>备注</th></tr></thead><tbody id="db"></tbody></table></div><div class="ar lock"><input id="di" placeholder="项目"><input id="dp" placeholder="负责人"><button class="btn bp" onclick="addDuty()">＋</button></div></div></section>
<section class="page" id="p-message"><div class="card"><h2>✉️ 留言箱</h2><p class="mt" style="margin-bottom:14px">留言仅存你自己的浏览器，不上传服务器（隐私保护）。</p><div class="mf"><input id="mn" placeholder="名字（留空=匿名）" maxlength="20"><textarea id="mc" placeholder="写下你想对班级说的话…" maxlength="200"></textarea><div><button class="btn bp" onclick="addMsg()">📨 发布</button></div></div><div class="ml" id="ml"></div></div></section>
<section class="page" id="p-schedule"><div class="card"><h2>🗓️ 课程表</h2><div class="tb"><button class="btn bp lock" onclick="saveAll()">💾 立即同步</button></div><div class="sw"><table class="sc"><thead><tr><th>节次</th><th>一</th><th>二</th><th>三</th><th>四</th><th>五</th></tr></thead><tbody id="sb"></tbody></table></div></div></section>
</main><footer><div data-k="footer">阳光班班级主页 · 班主任可修改内容 · 内容同步至 GitHub</div><div style="margin-top:4px">© <span id="yr"></span> 班级主页</div></footer></div>
<div class="mm hidden" id="lm"><div class="md"><h3>🔑 密钥登录</h3><p class="mt" style="margin-bottom:10px">输入密钥后即可编辑内容</p><div class="row"><label>密钥</label><input id="pi" type="password" placeholder="••••••"></div><div class="err" id="pe"></div><div class="ac"><button class="btn bp" onclick="doLogin()">登录</button></div></div></div>
<script>
const Q=["读万卷书，行万里路。","不积跬步，无以至千里。","业精于勤，荒于嬉。","少壮不努力，老大徒伤悲。","宝剑锋从磨砺出。","书山有路勤为径。","千里之行，始于足下。","学如逆水行舟。","勤能补拙。","今日事今日毕。","一寸光阴一寸金。","莫等闲，白了少年头。","黑发不知勤学早。","绳锯木断，水滴石穿。","失败乃成功之母。","有志者事竟成。","天行健，君子以自强不息。","三人行必有我师。","敏而好学，不耻下问。","温故而知新。","知识就是力量。","读书破万卷。","路漫漫其修远兮。","海阔凭鱼跃。","世上无难事。","虚心使人进步。","百尺竿头更进一步。","知之为知之。"];
const GH_USER='zkc301', GH_REPO='class-home', GH_BRANCH='main';
const LS={token:'gh_token',sha:'gh_data_sha',pwd:'ch_pwd',user:'ch_user',data:'ch_data',msg:'class_home_msg_v1'};
// 密钥列表（多个都能登录），逗号分隔
const DEF_KEYS='151128';
const DEF={title:'阳光班班级主页',infoClass:'三年二班',infoTeacher:'王老师',infoCount:'42人',infoSlogan:'向阳而生，逐光而行',notice:'1. 周五大扫除，请值日同学准时到岗。<br>2. 本周三穿校服佩戴红领巾。<br>3. 读书角已上新，欢迎借阅。',log:'【9月1日】开学第一天，精神饱满，新书到位。\n\n【9月2日】语文朗读比赛，张小明表现突出。\n\n【9月3日】天气晴朗，课间操全员到齐。',footer:'阳光班班级主页 · 班主任可修改内容 · 内容同步至 GitHub',homework:[{subject:'语文',content:'抄写生字词各两遍，背诵古诗三首'},{subject:'数学',content:'课本P12-13练习题1-5'},{subject:'英语',content:'听读Unit2，完成练习册'}],books:[{title:'夏洛的网',author:'E.B.怀特',desc:'关于爱、生命与承诺的温柔故事。'},{title:'小王子',author:'圣埃克苏佩里',desc:'真正重要的东西用眼睛是看不见的。'},{title:'窗边的小豆豆',author:'黑柳彻子',desc:'巴学园里发生的趣事。'}],honor:[{name:'张小明',reason:'数学竞赛一等奖'},{name:'李华',reason:'本月之星·乐于助人'},{name:'王芳',reason:'读书笔记优秀'}],duty:[{item:'擦黑板',person:'张小明',note:'每节课间'},{item:'扫地',person:'李华、王芳',note:'放学后'},{item:'倒垃圾',person:'刘强',note:'下午放学前'},{item:'关门窗灯',person:'值日班长',note:'最后离开'}],schedule:[['第一节','语文','数学','英语','语文','数学'],['第二节','数学','语文','数学','英语','语文'],['第三节','英语','科学','语文','数学','英语'],['第四节','音乐','道法','体育','科学','美术'],['第五节','美术','体育','道法','音乐','道法'],['第六节','班会','阅读','书法','阅读','自习']]};
let SH={},ADM=false;MK=LS.msg;
function dq(){const n=new Date(),s=n.getFullYear()*10000+(n.getMonth()+1)*100+n.getDate();document.getElementById('dq').textContent=Q[s%Q.length];const w=['日','一','二','三','四','五','六'][n.getDay()];document.getElementById('td').textContent=n.getFullYear()+'年'+(n.getMonth()+1)+'月'+n.getDate()+'日 星期'+w;}
function flash(m,t=1600){const d=document.createElement('div');d.textContent=m;d.style.cssText='position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#4ea3cc;color:#fff;padding:10px 22px;border-radius:24px;z-index:999;font-size:14px;box-shadow:0 4px 16px rgba(0,0,0,.2)';document.body.appendChild(d);setTimeout(()=>d.remove(),t);}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function g(k){return SH[k]!==undefined?SH[k]:DEF[k];}
function applySH(){document.querySelectorAll('[data-k]').forEach(e=>{const k=e.dataset.k;const v=SH[k];if(v===undefined)return;if(k==='log')e.innerHTML=String(v).replace(/\n/g,'<br>');else e.innerHTML=v;});document.title=SH.title||'班级主页';}
// —— 本地存储 ——
function saveLocal(){try{localStorage.setItem(LS.data,JSON.stringify(SH))}catch(e){}}
function loadLocal(){try{const d=localStorage.getItem(LS.data);if(d){SH=JSON.parse(d);return true}}catch(e){}return false}
// —— 密钥存储 ——
function getKeys(){return(localStorage.getItem(LS.pwd)||DEF_KEYS).split(',').map(k=>k.trim()).filter(Boolean);}
function saveKeys(list){localStorage.setItem(LS.pwd,list.join(','));}
// —— 登录/登出 ——
function openLogin(){document.getElementById('lm').classList.remove('hidden');setTimeout(()=>document.getElementById('pi').focus(),50);}
function doLogin(){const k=document.getElementById('pi').value.trim(),e=document.getElementById('pe');e.textContent='';if(!k){e.textContent='请输入密钥';return;}if(getKeys().includes(k)){localStorage.setItem(LS.user,'1');setAdm(true);flash('登录成功 ✅');document.getElementById('lm').classList.add('hidden');}else{e.textContent='密钥不对';}}
function doLogout(){localStorage.removeItem(LS.user);setAdm(false);flash('已退出');}
function setAdm(on){ADM=on;document.body.classList.toggle('admin',on);document.querySelectorAll('[data-k]').forEach(e=>e.setAttribute('contenteditable',on?'true':'false');e.setAttribute('ce',on?'true':'false'));const ab=document.getElementById('ab');if(on){ab.style.display='flex';document.getElementById('as').textContent='✅ 已登录';}else{ab.style.display='none';}renderAll();}
function renderHw(){const l=g('homework',[]),b=document.getElementById('hl');b.innerHTML='';l.forEach((it,i)=>{const d=document.createElement('div');d.className='hw';d.innerHTML='<span class="tag">'+esc(it.subject)+'</span><span class="va">'+esc(it.content)+'</span>'+(ADM?'<button class="dx">✕</button>':'');const c=d.querySelector('.va');c.setAttribute('contenteditable',ADM?'true':'false');c.setAttribute('contenteditable',ADM?'true':'false');c.setAttribute('ce',ADM?'true':'false');c.onblur=()=>{const a=g('homework',[]);a[i].content=c.textContent;SH.homework=a;saveLocal();};const x=d.querySelector('.dx');if(x)x.onclick=()=>{const a=g('homework',[]);a.splice(i,1);SH.homework=a;saveLocal();renderHw();};b.appendChild(d);});}
function addHw(){if(!ADM)return flash('请先登录');const s=document.getElementById('hs').value,c=document.getElementById('hc').value.trim();if(!c)return flash('请输入内容');const a=g('homework',[]);a.push({subject:s,content:c});SH.homework=a;document.getElementById('hc').value='';saveLocal();renderHw();}
function renderBooks(){const l=g('books',[]),g2=document.getElementById('bl');g2.innerHTML='';l.forEach((b,i)=>{const d=document.createElement('div');d.className='bk';d.innerHTML='<div class="bt">'+esc(b.title)+'</div><div class="ba">'+esc(b.author)+'</div><div class="va">'+esc(b.desc)+'</div>'+(ADM?'<button class="dx">✕</button>':'');g2.appendChild(d);const[t,a2,dd]=d.querySelectorAll('.bt,.ba,.va');[t,a2,dd].forEach(x=>{x.setAttribute('contenteditable',ADM?'true':'false');x.setAttribute('ce',ADM?'true':'false');});t.onblur=()=>{const z=g('books',[]);z[i].title=t.textContent;SH.books=z;saveLocal();};a2.onblur=()=>{const z=g('books',[]);z[i].author=a2.textContent;SH.books=z;saveLocal();};dd.onblur=()=>{const z=g('books',[]);z[i].desc=dd.textContent;SH.books=z;saveLocal();};const x=d.querySelector('.dx');if(x)x.onclick=()=>{const z=g('books',[]);z.splice(i,1);SH.books=z;saveLocal();renderBooks();};});}
function addBook(){if(!ADM)return flash('请先登录');const t=document.getElementById('bt').value.trim(),a=document.getElementById('ba').value.trim(),d=document.getElementById('bd').value.trim();if(!t)return flash('请输入书名');const z=g('books',[]);z.push({title:t,author:a||'佚名',desc:d||'值得一读'});SH.books=z;['bt','ba','bd'].forEach(id=>document.getElementById(id).value='');saveLocal();renderBooks();}
function renderHonor(){const l=g('honor',[]),b=document.getElementById('hl2');b.innerHTML='';const m=['🥇','🥈','🥉','⭐'];l.forEach((h,i)=>{const d=document.createElement('div');d.className='hr';d.innerHTML='<span class="medal">'+m[i%m.length]+'</span><div><div class="va">'+esc(h.name)+'</div><div class="mt">'+esc(h.reason)+'</div></div>'+(ADM?'<button class="dx" style="margin-left:auto">✕</button>':'');b.appendChild(d);const[n,r]=d.querySelectorAll('.va,.mt');[n,r].forEach(x=>{x.setAttribute('contenteditable',ADM?'true':'false');x.setAttribute('ce',ADM?'true':'false');});n.onblur=()=>{const z=g('honor',[]);z[i].name=n.textContent;SH.honor=z;saveLocal();};r.onblur=()=>{const z=g('honor',[]);z[i].reason=r.textContent;SH.honor=z;saveLocal();};const x=d.querySelector('.dx');if(x)x.onclick=()=>{const z=g('honor',[]);z.splice(i,1);SH.honor=z;saveLocal();renderHonor();};});}
function addHonor(){if(!ADM)return flash('请先登录');const n=document.getElementById('hn').value.trim(),r=document.getElementById('hr').value.trim();if(!n)return flash('请输入姓名');const z=g('honor',[]);z.push({name:n,reason:r||'优秀'});SH.honor=z;['hn','hr'].forEach(id=>document.getElementById(id).value='');saveLocal();renderHonor();}
function renderDuty(){const l=g('duty',[]),b=document.getElementById('db');b.innerHTML='';l.forEach((d,i)=>{const tr=document.createElement('tr');tr.innerHTML='<td class="va">'+esc(d.item)+'</td><td class="va">'+esc(d.person)+'</td><td><span class="va">'+esc(d.note)+'</span>'+(ADM?'<button class="dx">✕</button>':'')+'</td>';b.appendChild(tr);const[ii,pp,nn]=tr.querySelectorAll('.va');[ii,pp,nn].forEach(x=>{x.setAttribute('contenteditable',ADM?'true':'false');x.setAttribute('ce',ADM?'true':'false');});ii.onblur=()=>{const z=g('duty',[]);z[i].item=ii.textContent;SH.duty=z;saveLocal();};pp.onblur=()=>{const z=g('duty',[]);z[i].person=pp.textContent;SH.duty=z;saveLocal();};nn.onblur=()=>{const z=g('duty',[]);z[i].note=nn.textContent;SH.duty=z;saveLocal();};const x=tr.querySelector('.dx');if(x)x.onclick=()=>{const z=g('duty',[]);z.splice(i,1);SH.duty=z;saveLocal();renderDuty();};});}
function addDuty(){if(!ADM)return flash('请先登录');const it=document.getElementById('di').value.trim(),p=document.getElementById('dp').value.trim();if(!it)return flash('请输入项目');const z=g('duty',[]);z.push({item:it,person:p||'待定',note:''});SH.duty=z;['di','dp'].forEach(id=>document.getElementById(id).value='');saveLocal();renderDuty();}
function renderSchedule(){const r=g('schedule',[]),b=document.getElementById('sb');b.innerHTML='';r.forEach((row,ri)=>{const tr=document.createElement('tr');tr.innerHTML=row.map((c,ci)=>'<td class="'+(ci===0?'dc':'')+' va">'+esc(c)+'</td>').join('');b.appendChild(tr);tr.querySelectorAll('.va').forEach((el,ci)=>{el.setAttribute('contenteditable',ADM?'true':'false');el.setAttribute('ce',ADM?'true':'false');el.onblur=()=>{const z=g('schedule',[]);if(z[ri])z[ri][ci]=el.textContent;SH.schedule=z;saveLocal();};});});}
function getMsg(){try{return JSON.parse(localStorage.getItem(MK)||'[]')}catch(e){return[]}}function setMsg(m){localStorage.setItem(MK,JSON.stringify(m))}
function renderMsg(){const l=getMsg(),b=document.getElementById('ml');b.innerHTML='';if(!l.length){b.innerHTML='<div class="mt" style="text-align:center;padding:20px">还没有留言～</div>';return;}l.slice().reverse().forEach(m=>{const d=document.createElement('div');d.className='mg';d.innerHTML='<div class="mh"><span class="mn">'+esc(m.name)+'</span><span class="mt2">'+esc(m.time)+'</span></div><div class="va">'+esc(m.content)+'</div>';const x=document.createElement('button');x.className='dx';x.style.cssText='position:absolute;top:8px;right:10px';x.textContent='✕';x.onclick=()=>{const z=getMsg().filter(y=>y.id!==m.id);setMsg(z);renderMsg();};d.appendChild(x);b.appendChild(d);});}
function addMsg(){let n=document.getElementById('mn').value.trim();const c=document.getElementById('mc').value.trim();if(!c)return flash('请输入内容');if(!n)n='匿名同学';const l=getMsg(),now=new Date();l.push({id:Date.now(),name:n,content:c,time:(now.getMonth()+1)+'/'+now.getDate()+' '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')});setMsg(l);document.getElementById('mn').value='';document.getElementById('mc').value='';renderMsg();}
function renderAll(){renderHw();renderBooks();renderHonor();renderDuty();renderSchedule();renderMsg();}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-p]');if(!b)return;document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById('p-'+b.dataset.p).classList.add('active');window.scrollTo({top:0,behavior:'smooth'});});
document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.shiftKey){if(e.key.toLowerCase()==='l'){e.preventDefault();openLogin();}else if(e.key.toLowerCase()==='x'){e.preventDefault();doLogout();}}if(e.key==='Escape'){document.getElementById('lm').classList.add('hidden');}});
document.getElementById('pi')&&document.getElementById('pi').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
// 监听全局 contenteditable 元素 blur，自动收集+保存
document.addEventListener('blur',e=>{const el=e.target;if(el.getAttribute&&el.getAttribute('ce')==='true'||el.getAttribute('contenteditable')==='true'&&ADM){const k=el.dataset.k;if(k){let v=el.innerHTML;if(k==='log')v=el.innerText;SH[k]=v;saveLocal();}else{saveLocal();}}},true);

// —— 启动 ——
SH=JSON.parse(JSON.stringify(DEF));
// 优先加载本地保存的数据
if(loadLocal()){applySH();}
else{applySH();}
renderAll();
dq();
document.getElementById('yr').textContent=new Date().getFullYear();
// 检查是否已登录
if(!!localStorage.getItem(LS.user)){setAdm(true);}
</script></body></html>
